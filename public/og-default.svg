<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <!-- og-default — brand mono ~/wakii. aesthetic (tokens.css: bg #0A0E0D, accent #45E0A8, text #D7E2DD, dim #6B7A74) -->
  <defs>
    <radialGradient id="glow" cx="30%" cy="38%" r="55%">
      <stop offset="0%" stop-color="#45E0A8" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#45E0A8" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="40" height="40" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.5" fill="#45E0A8" fill-opacity="0.07"/>
    </pattern>
  </defs>

  <rect width="1200" height="630" fill="#0A0E0D"/>
  <rect width="1200" height="630" fill="url(#dots)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>

  <!-- terminal window chrome: thin frame -->
  <rect x="40" y="40" width="1120" height="550" fill="none" stroke="#45E0A8" stroke-opacity="0.18" stroke-width="2" rx="16"/>

  <!-- prompt line: ~/ dim, wakii text, . + cursor accent -->
  <g font-family="'JetBrains Mono', Menlo, monospace">
    <text x="120" y="300" font-size="132" font-weight="700">
      <tspan fill="#6B7A74">~/</tspan><tspan fill="#D7E2DD">wakii</tspan><tspan fill="#45E0A8">.</tspan>
    </text>
    <rect x="762" y="200" width="22" height="104" fill="#45E0A8"/>
    <text x="120" y="386" font-size="36" fill="#6B7A74">Agentic IDE with a built-in superpowers team</text>
  </g>

  <!-- domain mark -->
  <text x="1120" y="548" font-family="'JetBrains Mono', Menlo, monospace" font-size="26" fill="#6B7A74" text-anchor="end">wakii.xyz</text>
</svg>
